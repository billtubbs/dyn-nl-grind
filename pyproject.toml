[project]
name = "dyn_nl_grind"
version = "0.1.0"
description = "Dynamic grinding circuit model based on le Roux and Steyn (2022)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "casadi>=3.6",
  "numpy>=1.25",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "casadi-models @ git+https://github.com/billtubbs/casadi-models.git@main",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
